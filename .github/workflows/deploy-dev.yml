# Deploys `develop` to the GCP dev project. Requires the one-time setup in infra/gcp/README.md
# and these GitHub *environment* variables on the `dev` environment (no JSON keys anywhere —
# authentication is Workload Identity Federation):
#
#   GCP_PROJECT_ID     e.g. hodi-dev
#   GCP_REGION         e.g. africa-south1   (open owner decision: africa-south1 vs europe-west1)
#   GCP_WIF_PROVIDER   projects/<number>/locations/global/workloadIdentityPools/github/providers/github
#   GCP_DEPLOY_SA      deployer@<project>.iam.gserviceaccount.com
#   GCP_RUNTIME_SA     hodi-api@<project>.iam.gserviceaccount.com
#   CLOUD_SQL_INSTANCE <project>:<region>:hodi-pg
#   APP_URL            public URL of the web app, e.g. https://<project>.web.app
#   JOBS_AUDIENCE      audience of Cloud Scheduler's OIDC tokens (the hodi-api URL); optional
#   GCP_SCHEDULER_SA   scheduler@<project>.iam.gserviceaccount.com; optional (both unset = jobs off)
#   API_URL            the hodi-api Cloud Run URL. M-Pesa callbacks must come straight to it (not
#                      through Firebase Hosting), or the Safaricom address check sees the CDN's IP
#
# SMS/email default to the log adapters (messages are only logged). To send for real, add
# SMS_PROVIDER/EMAIL_PROVIDER and their credentials as secrets — see infra/gcp/README.md.
name: Deploy (dev)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false # never interrupt a migration half-way

permissions:
  contents: read
  id-token: write # Workload Identity Federation

jobs:
  backend:
    runs-on: ubuntu-latest
    environment: dev
    env:
      IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/hodi
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push images
        working-directory: backend
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE_BASE/api:$GITHUB_SHA" .
          docker build --target migrate -t "$IMAGE_BASE/migrate:$GITHUB_SHA" .
          docker push "$IMAGE_BASE/api:$GITHUB_SHA"
          docker push "$IMAGE_BASE/migrate:$GITHUB_SHA"

      - name: Run database migrations
        run: |
          gcloud run jobs deploy hodi-migrate \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --image "$IMAGE_BASE/migrate:$GITHUB_SHA" \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --set-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE }}" \
            --set-secrets DATABASE_URL=hodi-database-url:latest \
            --max-retries 0 --task-timeout 10m \
            --execute-now --wait

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy hodi-api \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --image "$IMAGE_BASE/api:$GITHUB_SHA" \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --add-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE }}" \
            --set-secrets DATABASE_URL=hodi-database-url:latest,JWT_SECRET=hodi-jwt-secret:latest,FIELD_ENCRYPTION_KEYS=hodi-field-keys:latest,FIELD_INDEX_KEY=hodi-field-index-key:latest \
            --set-env-vars "NODE_ENV=production,GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},ENABLE_DOCS=true,TRUST_PROXY_HOPS=1,APP_URL=${{ vars.APP_URL }},JOBS_OIDC_AUDIENCE=${{ vars.JOBS_AUDIENCE }},JOBS_INVOKER_EMAIL=${{ vars.GCP_SCHEDULER_SA }},PUBLIC_API_URL=${{ vars.API_URL }},DARAJA_MODE=live,STORAGE_DRIVER=gcs,STORAGE_BUCKET=${{ vars.GCP_PROJECT_ID }}-hodi-files" \
            --port 8080 --cpu-boost \
            --min-instances 0 --max-instances 5 \
            --allow-unauthenticated
          # dev: min-instances 0 to save cost. prod: min-instances 1 so M-Pesa callbacks never
          # hit a cold start (design §4.6). The API does its own auth; Cloud Run IAM stays open
          # because Firebase Hosting rewrites call it as a public service.

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@14 deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
