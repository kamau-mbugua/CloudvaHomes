name: CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mobile/**'
      - 'landing/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mobile/**'
      - 'landing/**'
      - 'infra/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'

# Pull requests: a newer push cancels the older run. Pushes to main/dev are never cancelled,
# because their run ends with the deploy job, and stopping a deploy midway could interrupt a
# migration. A newer push queues behind it instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      landing: ${{ steps.filter.outputs.landing }}
      deploy_app: ${{ steps.filter.outputs.deploy_app }}
      deploy_landing: ${{ steps.filter.outputs.deploy_landing }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          base: ${{ github.ref_name }}
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'
            landing:
              - 'landing/**'
              - '.github/workflows/ci.yml'
            # What the deploy job looks at. On a push these cover every commit in the push
            # (compared with the branch before it), so a last commit that only touches
            # landing/ can't hide backend or web changes made earlier in the same push.
            deploy_app:
              - 'backend/**'
              - 'frontend/**'
              - 'infra/**'
              - '.github/workflows/deploy.yml'
            deploy_landing:
              - 'landing/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hodi
          POSTGRES_PASSWORD: hodi
          POSTGRES_DB: hodi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hodi -d hodi_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://hodi:hodi@localhost:5432/hodi_test
      TEST_DATABASE_URL: postgresql://hodi:hodi@localhost:5432/hodi_test
      # Test-only value; real secrets live in GCP Secret Manager.
      JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      # CI-only keys (32 bytes of 0x01 / 0x02); real keys live in Secret Manager.
      FIELD_ENCRYPTION_KEYS: ci1:AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      FIELD_INDEX_KEY: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check "src/**/*.ts" "test/**/*.ts"
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - name: OpenAPI document builds
        run: npm run openapi:export -- openapi.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: openapi
          path: backend/openapi.json
      - name: Docker images build (runtime + migrate)
        run: |
          docker build -t hodi-api:ci .
          docker build --target migrate -t hodi-migrate:ci .

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
          # Pinned: an unpinned stable moved to 3.50, which deprecates package:flutter/material.dart
          # (for package:material_ui) and fails `analyze --fatal-infos` on every file. Upgrade on
          # purpose, together with that migration.
          flutter-version: 3.41.1
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test

  landing:
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
      - name: Verify landing page HTML, DOM bindings & inline scripts
        run: node landing/check.mjs

  # Pushes to main/dev only: deploys after the checks for what ships (API, web, landing)
  # passed. A skipped check (nothing changed there) is fine; a failed or cancelled one stops
  # the deploy. Mobile isn't deployed from here, so a mobile failure doesn't hold a server fix.
  deploy:
    name: Deploy
    needs: [changes, backend, frontend, landing]
    if: >-
      ${{ github.event_name == 'push' && !cancelled()
          && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
          && (needs.changes.outputs.deploy_app == 'true' || needs.changes.outputs.deploy_landing == 'true') }}
    permissions:
      contents: read
      packages: write # deploy.yml pushes images to ghcr.io
    uses: ./.github/workflows/deploy.yml
    with:
      landing_only: ${{ needs.changes.outputs.deploy_app != 'true' }}
    secrets: inherit
