                        type: array
                        items: { $ref: '#/components/schemas/Expense' }
        default: { $ref: '#/components/responses/Error' }

  /expenses/new:
    post:
      tags: [Expenditure]
      operationId: createExpense
      summary: Record an expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [propertyId, estateId, name, amount]
              properties:
                propertyId: { type: integer }
                estateId: { type: integer }
                name: { type: string }
                description: { type: string }
                amount: { type: string, description: Numeric string }
                month: { type: integer, description: 'App always sends 0 (current month)' }
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  /expenses/void/{id}:
    post:
      tags: [Expenditure]
      operationId: voidExpense
      summary: Void an expense
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── USERS ─────────────────────────────
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Paginated staff users
      description: Page.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchTerm'
      responses:
        '200':
          description: Users page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Error' }

  /users/new:
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a staff user (credentials sent by email/SMS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, username, idNo, email, phone, estateId, userGroupId]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                username: { type: string }
                idNo: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                estateId: { type: integer }
                userGroupId: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  /users/flags/{action}/{id}:
    post:
      tags: [Users]
      operationId: flagUser
      summary: Activate / deactivate / delete a user
      parameters:
        - $ref: '#/components/parameters/FlagAction'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── USER GROUPS ─────────────────────────────
  /user-groups:
    get:
      tags: [User Groups]
      operationId: listUserGroups
      summary: Paginated roles (a group = a set of ROLE_* authorities)
      description: Page.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchTerm'
      responses:
        '200':
          description: User groups page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/UserGroup' }
        default: { $ref: '#/components/responses/Error' }

  /all-user-groups:
    get:
      tags: [User Groups]
      operationId: listAllUserGroups
      summary: All groups (for the "add user" dropdown)
      description: Raw array.
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [userTypeId, name, estate, estateId, id]
                  properties:
                    userTypeId: { type: integer }
                    name: { type: string }
                    estate: { type: string }
                    estateId: { type: integer }
                    id: { type: integer }
        default: { $ref: '#/components/responses/Error' }

  /user-groups/flags/delete/{id}:
    post:
      tags: [User Groups]
      operationId: deleteUserGroup
      summary: Delete a user group
      description: 'Called with a leading slash — see compatibility rule 8 (also serve at host root).'
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  /user-groups/flags/deactivate/{id}:
    post:
      tags: [User Groups]
      operationId: deactivateUserGroup
      summary: Deactivate a user group
      description: 'Called with a leading slash — see compatibility rule 8 (also serve at host root).'
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────── PROPOSED: PAYMENT INTEGRATIONS ─────────────────────
  /integrations/mpesa/stk-callback:
    post:
      tags: [Proposed — Payment Integrations]
      operationId: mpesaStkCallback
      security: []
      summary: Daraja STK Push result callback
      description: |
        Safaricom posts the outcome of the STK push started by `POST /payments/receive-payments`
        (type 12). Match on `CheckoutRequestID`, record the payment idempotently
        (`MpesaReceiptNumber` is unique), allocate to invoices, then reply with ResultCode 0.
        Protect with an unguessable path token and/or IP allow-listing — Daraja does not sign callbacks.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DarajaStkCallback' }
      responses:
        '200': { $ref: '#/components/responses/DarajaAck' }

  /integrations/mpesa/c2b/validation:
    post:
      tags: [Proposed — Payment Integrations]
      operationId: mpesaC2bValidation
      security: []
      summary: Daraja C2B validation (tenant pays to paybill directly)
      description: '`BillRefNumber` should be the house number or invoice ref. Reject unknown accounts if strict mode is on.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DarajaC2bRequest' }
      responses:
        '200': { $ref: '#/components/responses/DarajaAck' }

  /integrations/mpesa/c2b/confirmation:
    post:
      tags: [Proposed — Payment Integrations]
      operationId: mpesaC2bConfirmation
      security: []
      summary: Daraja C2B confirmation — creates a payment-statement line
      description: |
        Writes a `payment-statements` row (`used=false`). Auto-allocate to the matching tenant's
        oldest unpaid invoice when `BillRefNumber` resolves; otherwise leave for manual allocation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DarajaC2bRequest' }
      responses:
        '200': { $ref: '#/components/responses/DarajaAck' }

  /integrations/banks/{bankCode}/notifications:
    post:
      tags: [Proposed — Payment Integrations]
      operationId: bankPaymentNotification
      security: []
      summary: Generic inbound bank payment notification (IPN)
      description: |
        One adapter per bank (Equity, KCB, Co-op, etc.); each normalises its payload into a
        `payment-statements` line. Verify the bank's signature/HMAC before trusting the body.
        Payload shape is bank-specific and will be defined per integration.
      parameters:
        - name: bankCode
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }

  /payments/stk/{checkoutRequestId}/status:
    get:
      tags: [Proposed — Payment Integrations]
      operationId: getStkStatus
      summary: Poll the result of an STK push (for the web app / a future app version)
      parameters:
        - name: checkoutRequestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StatusResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          state: { type: string, enum: [PENDING, SUCCESS, FAILED, CANCELLED, TIMEOUT] }
                          mpesaReceiptNumber: { type: string, nullable: true }
                          amount: { type: number, format: double }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token from `POST /login` → `data.tokenDetails.accessToken`.

  parameters:
    Page:
      name: page
      in: query
      description: 0-based page index.
      schema: { type: integer, minimum: 0, default: 0 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, default: 10 }
    SearchTerm:
      name: searchTerm
      in: query
      schema: { type: string }
    EstateIdQuery:
      name: estateId
      in: query
      description: Empty = the caller's estate.
      schema: { type: string }
    PropertyIdQuery:
      name: propertyId
      in: query
      description: Empty = all properties.
      schema: { type: string }
    CategoryIdQuery:
      name: categoryId
      in: query
      schema: { type: string }
    UserIdQuery:
      name: userId
      in: query
      description: Only sent when filtering by one tenant.
      schema: { type: string }
    Self:
      name: self
      in: query
      description: true = only records belonging to the logged-in user (tenant view).
      schema: { type: boolean }
    Month:
      name: month
      in: query
      description: 1–12, or empty for all.
      schema: { type: string }
    Year:
      name: year
      in: query
      schema: { type: string }
    StartDate:
      name: startDate
      in: query
      schema: { type: string, format: date }
    EndDate:
      name: endDate
      in: query
      schema: { type: string, format: date }
    Simple:
      name: simple
      in: query
      schema: { type: boolean }
    Metred:
      name: metred
      in: query
      schema: { type: boolean }
    EstateIdPath:
      name: estateId
      in: path
      required: true
      schema: { type: string }
    PropertyIdPath:
      name: propertyId
      in: path
      required: true
      schema: { type: string }
    HouseIdPath:
      name: houseId
      in: path
      required: true
      schema: { type: string }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
    InvoiceRefPath:
      name: invoiceRef
      in: path
      required: true
      description: Invoice RRN (reference number).
      schema: { type: string }
    InvoiceStatusPath:
      name: invoiceStatus
      in: path
      required: true
      description: 0 UNPAID, 2 PAID, 3 BF (brought forward).
      schema: { type: integer, enum: [0, 2, 3] }
    FlagAction:
      name: action
      in: path
      required: true
      schema: { type: string, enum: [activate, deactivate, delete] }

  responses:
    StatusOk:
      description: '`status: "00"` = success; anything else is a business failure and `message` is shown.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StatusResponse' }
          example: { status: '00', message: Successful }
    Error:
      description: 'HTTP error. 401 or `code: auth-001` logs the user out.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            errors:
              - { code: password, message: The password field is required. }
    DarajaAck:
      description: Acknowledgement Safaricom expects
      content:
        application/json:
          schema:
            type: object
            properties:
              ResultCode: { type: integer, example: 0 }
              ResultDesc: { type: string, example: Accepted }

  schemas:
    # ── Envelopes ──
    StatusResponse:
      type: object
      required: [status, message]
      properties:
        status: { type: string, example: '00' }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string, description: 'Field name, "401", or "auth-001"' }
              message: { type: string }
    PageMeta:
      type: object
      description: Spring Data Page metadata. Items are in `content`.
      properties:
        number: { type: integer, description: Current page (0-based) }
        size: { type: integer }
        numberOfElements: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
        empty: { type: boolean }
        pageable:
          type: object
          description: Only parsed for /user-groups — include it everywhere for safety.
          properties:
            offset: { type: integer }
            pageNumber: { type: integer }
            pageSize: { type: integer }
            paged: { type: boolean }
            unpaged: { type: boolean }
            sort: { $ref: '#/components/schemas/PageSort' }
        sort: { $ref: '#/components/schemas/PageSort' }
    PageSort:
      type: object
      properties:
        empty: { type: boolean }
        sorted: { type: boolean }
        unsorted: { type: boolean }
    IdName:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    IdNameString:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    DataUriImage:
      type: string
      description: 'data:image/<ext>;base64,<payload> — store in object storage, keep only the URL.'
      example: data:image/jpeg;base64,/9j/4AAQSkZJRg...

    # ── Auth / profile ──
    LoginResponse:
      type: object
      required: [status, message, data]
      properties:
        status: { type: string }
        message: { type: string }
        data:
          type: object
          required: [tokenDetails, userDetails]
          properties:
            tokenDetails:
              type: object
              required: [expiry, accessToken]
              properties:
                expiry: { type: string, description: Expiry timestamp as string }
                accessToken: { type: string }
            userDetails:
              type: object
              required: [name, estate, usertype, id, authorities, username]
              properties:
                name: { type: string }
                estate: { type: string }
                estateId: { type: string, description: 'STRING, not integer' }
                usertype: { type: string, example: admins, description: '"admins" or "tenant"' }
                id: { type: string, description: 'STRING, not integer' }
                username: { type: string }
                authorities:
                  type: array
                  description: Drives every permission check in the app.
                  items:
                    type: object
                    required: [authority]
                    properties:
                      authority: { $ref: '#/components/schemas/Authority' }
    Authority:
      type: string
      enum:
        - ROLE_CATEGORIES
        - ROLE_CATEGORIES_DELETE
        - ROLE_CATEGORIES_EDIT
        - ROLE_CATEGORIES_NEW
        - ROLE_CATEGORIES_VIEW
        - ROLE_DASHBOARD
        - ROLE_DASHBOARD_VIEW
        - ROLE_EXPENDITURES
        - ROLE_EXPENDITURES_DELETE
        - ROLE_EXPENDITURES_EDIT
        - ROLE_EXPENDITURES_NEW
        - ROLE_EXPENDITURES_VIEW
        - ROLE_EXPENSES
        - ROLE_EXPENSES_DELETE
        - ROLE_EXPENSES_NEW
        - ROLE_EXPENSES_VIEW
        - ROLE_HOUSES
        - ROLE_HOUSES_DELETE
        - ROLE_HOUSES_EDIT
        - ROLE_HOUSES_NEW
        - ROLE_HOUSES_VIEW
        - ROLE_INVOICES
        - ROLE_INVOICES_DELETE
        - ROLE_INVOICES_EDIT
        - ROLE_INVOICES_NEW
        - ROLE_INVOICES_VIEW
        - ROLE_METRES
        - ROLE_METRES_DELETE
        - ROLE_METRES_EDIT
        - ROLE_METRES_NEW
        - ROLE_METRES_VIEW
        - ROLE_PAYMENTS
        - ROLE_PAYMENTS_DELETE
        - ROLE_PAYMENTS_EDIT
        - ROLE_PAYMENTS_NEW
        - ROLE_PAYMENTS_VIEW
        - ROLE_PAYMENT_TYPES
        - ROLE_PAYMENT_TYPES_DELETE
        - ROLE_PAYMENT_TYPES_EDIT
        - ROLE_PAYMENT_TYPES_NEW
        - ROLE_PAYMENT_TYPES_VIEW
        - ROLE_PROPERTIES
        - ROLE_PROPERTIES_DELETE
        - ROLE_PROPERTIES_EDIT
        - ROLE_PROPERTIES_NEW
        - ROLE_PROPERTIES_VIEW
        - ROLE_PROPERTY_INVOICES
        - ROLE_PROPERTY_INVOICES_DELETE
        - ROLE_PROPERTY_INVOICES_EDIT
        - ROLE_PROPERTY_INVOICES_VIEW
        - ROLE_PROPERTY_PAYMENTS
        - ROLE_PROPERTY_PAYMENTS_DELETE
        - ROLE_PROPERTY_PAYMENTS_EDIT
        - ROLE_PROPERTY_PAYMENTS_NEW
        - ROLE_PROPERTY_PAYMENTS_VIEW
        - ROLE_PROPERTY_REPORTS
        - ROLE_PROPERTY_REPORTS_VIEW
        - ROLE_REASON_CODES
        - ROLE_REASON_CODES_DELETE
        - ROLE_REASON_CODES_EDIT
        - ROLE_REASON_CODES_NEW
        - ROLE_REASON_CODES_VIEW
        - ROLE_TENANTS
        - ROLE_TENANTS_DELETE
        - ROLE_TENANTS_EDIT
        - ROLE_TENANTS_NEW
        - ROLE_TENANTS_VIEW
        - ROLE_TENANT_ACCESS
        - ROLE_TENANT_ACCESS_DELETE
        - ROLE_TENANT_ACCESS_NEW
        - ROLE_TENANT_ACCESS_VIEW
        - ROLE_USERS
        - ROLE_USERS_DELETE
        - ROLE_USERS_EDIT
        - ROLE_USERS_NEW
        - ROLE_USERS_VIEW
        - ROLE_USER_GROUPS
        - ROLE_USER_GROUPS_DELETE
        - ROLE_USER_GROUPS_EDIT
        - ROLE_USER_GROUPS_NEW
        - ROLE_USER_GROUPS_VIEW
        - ROLE_UTILITY_BILLS
        - ROLE_UTILITY_BILLS_DELETE
        - ROLE_UTILITY_BILLS_EDIT
        - ROLE_UTILITY_BILLS_NEW
        - ROLE_UTILITY_BILLS_VIEW
    UserProfile:
      type: object
      required: [lastName, firstName, passwordExpiry, phone, estate, usertype, fullNames, id, userGroup, email]
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        fullNames: { type: string }
        photoUrl: { type: string, nullable: true }
        passwordExpiry: { type: string }
        phone: { type: string }
        email: { type: string }
        estate: { type: string }
        usertype: { type: string }
        userGroup: { type: string }

    # ── Dashboard / reports ──
    DashboardSummary:
      type: object
      properties:
        expenseCount: { type: integer }
        invoiceCount: { type: integer }
        paymentCount: { type: integer }
        occupiedUnits: { type: integer, nullable: true }
        totalInvoice: { type: number, format: double }
        totalPayment: { type: number, format: double }
        totalArrears: { type: number, format: double }
        totalRent: { type: number, format: double }
        totalExpense: { type: number, format: double }
    UnitComparison:
      type: object
      properties:
        totalUnits: { type: integer }
        occupiedUnits: { type: integer }
        totalInvoice: { type: number, format: double }
        totalPayment: { type: number, format: double }
        totalArrears: { type: number, format: double }
        totalRent: { type: number, format: double }
        totalExpense: { type: number, format: double }
    PropertyReportRow:
      type: object
      required: [expenseCount, estateId, year, estate, invoiceCount, monthName, invoiceAmount, paymentAmount, totalUnits, rentArrears, expenseAmount, month, rentAmount, property, netIncome, occupiedUnits, id, propertyId, paymentCount]
      properties:
        id: { type: integer }
        estateId: { type: integer }
        estate: { type: string }
        propertyId: { type: integer }
        property: { type: string }
        year: { type: integer }
        month: { type: integer }
        monthName: { type: string }
        totalUnits: { type: integer }
        occupiedUnits: { type: integer }
        invoiceCount: { type: integer }
        paymentCount: { type: integer }
        expenseCount: { type: integer }
        rentAmount: { type: number, format: double }
        invoiceAmount: { type: number, format: double }
        paymentAmount: { type: number, format: double }
        expenseAmount: { type: number, format: double }
        rentArrears: { type: number, format: double }
        netIncome: { type: number, format: double }

    # ── Properties / houses ──
    Property:
      type: object
      required: [email, location, estateId, id, name]
      properties:
        id: { type: integer }
        estateId: { type: integer }
        name: { type: string }
        location: { type: string }
        email: { type: string }
    HouseSpecs:
      type: object
      required: [floors, houseTypes, houseCategories, houseNumbers]
      properties:
        floors:
          type: array
          items: { $ref: '#/components/schemas/IdName' }
        houseTypes:
          type: array
          items:
            type: object
            required: [id, name, description, units]
            properties:
              id: { type: integer }
              name: { type: string, example: 2 Bedroom }
              description: { type: string }
              units: { type: integer }
        houseCategories:
          type: array
          items: { $ref: '#/components/schemas/IdName' }
        houseNumbers:
          type: array
          description: House numbers already used in this property.
          items: { type: string }
    HouseFeatures:
      type: object
      required: [features, featureIds]
      properties:
        features:
          type: array
          items:
            type: object
            required: [name, id, houseSpecific]
            properties:
              id: { type: integer }
              name: { type: string }
              houseSpecific: { type: boolean }
        featureIds:
          type: array
          items: { type: integer }
    House:
      type: object
      properties:
        id: { type: integer }
        estateId: { type: integer }
        estate: { type: string }
        propertyId: { type: integer }
        property: { type: string }
        location: { type: string }
        categoryId: { type: integer }
        category: { type: string }
        houseTypeId: { type: integer }
        houseType: { type: string }
        houseNumber: { type: string }
        houseName: { type: string }
        description: { type: string }
        floor: { type: integer }
        rent: { type: number, format: double }
        squareFt: { type: number, format: double }
        features: { type: integer, description: Feature count }
        occupied: { type: boolean }
        overdueEstate: { type: boolean }
        lastOccupied: { type: string }
        createdOn: { type: string }
        status: { type: integer }
    HouseDetails:
      type: object
      required: [rent]
      properties:
        houseType: { type: string }
        houseNumber: { type: string }
        estate: { type: string }
        property: { type: string }
        location: { type: string }
        floor: { type: string, description: STRING here (integer in the list endpoint) }
        category: { type: string }
        rent: { type: number }
        squareFt: { type: number }
        isOccupied: { type: boolean }
        showHistory: { type: boolean }
        lastOccupiedDate: { type: string, format: date-time, nullable: true }
        status: { type: integer }
        tenant:
          type: object
          description: Current occupant; send `{}` when vacant.
          properties:
            name: { type: string }
            phone: { type: string }
            invoiceRrn: { type: string }
            invoiceMonth: { type: string }
            dueDate: { type: string, format: date-time }
            occupiedOn: { type: string, format: date-time }
            rentOwed: { type: number }
            refundableAmount: { type: number }
    UnoccupiedHouse:
      type: object
      required: [houseName, houseNumber, id, floor, rent, occupied]
      properties:
        id: { type: integer }
        houseName: { type: string }
        houseNumber: { type: string }
        floor: { type: integer }
        rent: { type: number, format: double }
        occupied: { type: boolean }
    HouseCategory:
      type: object
      required: [images, name, estate, property, description, units, id, createdOn, categoryId, status]
      properties:
        id: { type: integer }
        categoryId: { type: integer }
        name: { type: string }
        description: { type: string }
        estate: { type: string }
        property: { type: string }
