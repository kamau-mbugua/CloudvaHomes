openapi: 3.0.3
info:
  title: Hodi Rental Management API
  version: 1.0.0-legacy
  description: |
    > **REFERENCE ONLY (2026-10-27).** The Flutter app is being refactored onto the new
    > platform API, so this legacy contract is NOT binding. Use it to understand how Hodi
    > operated (domain, flows, enums). The new design is `docs/specs/2026-10-27-hodi-platform-design.md`.

    API contract reverse-engineered from the existing Flutter client (`hodi_app`).
    The original backend (Spring Boot, judging by the Page/`content` envelopes) was lost.
    The "compatibility rules" below describe what the *unmodified* app would need.

    Source of every endpoint: `hodi_app/lib/repository/authenticated_repo.dart`,
    `auth_repo.dart`, and the models in `hodi_app/lib/models/data/**`.

    ## Compatibility rules (read before implementing)

    1. **Response envelopes are NOT uniform.** Each operation documents exactly one of:
       - **Raw** — the JSON body *is* the object/array (no wrapper).
       - **Page** — Spring-style page: `{content: [...], number, size, numberOfElements, totalElements, ...}`.
       - **Envelope** — `{status, message, data}` where `status: "00"` means success.
       - **Status** — `{status, message}` only (all write operations).
       Changing an envelope breaks the app.
    2. **Write operations return HTTP 200 with `status: "00"` on success.** Any other `status`
       value is treated as a business failure and `message` is shown to the user as a snackbar.
    3. **Errors (HTTP 4xx/5xx)** must use `{"errors":[{"code":"...","message":"..."}]}`.
       HTTP 401, or an error with `code: "auth-001"`, logs the user out.
       For 500/503 the app shows the HTTP status text, not the body.
    4. **Dart is strictly typed — JSON types must match exactly.**
       - A field documented as `string` must be a JSON string even if it holds a number or id
         (e.g. login `userDetails.id`, invoice detail `invoiceAmount`). Sending `123` instead of
         `"123"` crashes the screen.
       - A field documented `format: double` must be emitted **with a decimal point**
         (`5000.0`, not `5000`). Dart decodes `5000` as `int` and several models assign it to a
         `double` field without conversion, which throws at runtime.
       - A field documented `integer` must not carry a fractional part.
       - Fields listed under `required` are parsed without a null fallback — never send `null`.
    5. **Pagination**: `page` is **0-based**, `pageSize` is the page size. The client stops
       paging when a page returns fewer than `pageSize` items. Empty filter parameters are sent as
       empty strings (`propertyId=`) and must be treated as "no filter".
    6. **Auth**: `Authorization: Bearer <accessToken>` on every request, including login (where it
       is `Bearer ` with an empty token — ignore it).
    7. **Images** (meter readings) are sent inline as data URIs:
       `data:image/<ext>;base64,<payload>`. Payment-type icons are returned as raw base64 strings.
    8. Two endpoints are called with a **leading slash** (`/user-groups/flags/delete/{id}`,
       `/user-groups/flags/deactivate/{id}`). Dio resolves these against the host root, i.e.
       `https://<host>/user-groups/...` **outside** `/api`. Serve them at both paths, or fix the
       client constants.

    ## Domain glossary
    - **Estate** — a landlord / management company account (the tenant of the SaaS). Users belong to one estate.
    - **Property** — a building or compound owned by an estate.
    - **House** — a rentable unit inside a property (has floor, type, category, rent).
    - **Tenant invoice** (`/invoices`) — monthly bill to a tenant: rent + utility bills.
    - **Estate invoice** (`/estate-invoices`) — the platform (Hodi) billing the estate, e.g. a commission
      per occupied unit. Unpaid estate invoices can block the estate (`check-status`).
    - **Payment type** — a configured way to receive money (Cash, Cheque, Bank slip, M-Pesa STK…)
      linked to a bank/paybill account for a property.
    - **Utility bill** — a charge added to tenant invoices: fixed, variable, or metered.
    - **Onboard ("new let") fee** — a one-off charge when a tenant moves in (deposit, other).

    ## Enumerations used across endpoints
    - Invoice status (path param on invoice lists): `0` UNPAID, `2` PAID, `3` BF (brought forward).
    - Payment type ids used by the client: `1` Cash, `2` Cheque, `11` Bank deposit slip, `12` M-Pesa STK push.
    - Utility bill `type`: `0` Fixed Amount, `1` Variable Amount, `2` Metred Bill.
    - Onboard fee `type`: `0` Rent Deposit, `1` Other Fees.
    - Recurrent expenditure `frequency`: `1` Monthly, `2` Once in two months, `3` Quarterly.
    - Flag `action` path param: `activate`, `deactivate`, `delete`.
    - `usertype` values the client checks: `admins`, `tenant`.
    - Estate check-status: `00` paid, `001` unpaid (prompt to pay), `002` blocked (locked out).

servers:
  - url: https://hodi.qnex.io/api
    description: Production (legacy host baked into the prod flavor)
  - url: https://hodi-test.qnex.io/api
    description: Dev / UAT (legacy host baked into dev and uat flavors)
  - url: http://localhost:8080/api
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Profile
  - name: Dashboard & Reports
  - name: Properties
  - name: Houses
  - name: House Categories
  - name: Tenants
  - name: Meters
  - name: Tenant Invoices
  - name: Estate Invoices
  - name: Payments
  - name: Estate Payments
  - name: Payment Types
  - name: Utility Bills
  - name: Onboard Fees
  - name: Expenditure
  - name: Users
  - name: User Groups
  - name: Proposed — Payment Integrations
    description: |
      NOT called by the current app. Required server-side so that M-Pesa STK (payment type 12)
      and bank deposits can be confirmed automatically. Shapes follow the Safaricom Daraja API.

paths:
  # ───────────────────────────── AUTH ─────────────────────────────
  /login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Log in with username + password
      description: Envelope. App reads `data.tokenDetails.accessToken` and stores the whole response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Login result. Non-"00" status shows `message` as the login error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        default: { $ref: '#/components/responses/Error' }

  /forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      security: []
      summary: Start password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, description: Username or email the user typed }
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  /delete-account:
    post:
      tags: [Auth]
      operationId: deleteAccount
      summary: Delete own account (app-store requirement)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  /otps/initiate-type-otp/{estateId}:
    get:
      tags: [Auth]
      operationId: requestPaymentTypeOtp
      summary: Send an OTP to the estate admin before adding a payment account
      description: The OTP is then submitted in `POST /estate/payment-types/new`.
      parameters:
        - $ref: '#/components/parameters/EstateIdPath'
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── PROFILE ─────────────────────────────
  /profile/user-details:
    get:
      tags: [Profile]
      operationId: getUserProfile
      summary: Current user's profile
      description: Raw object.
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── DASHBOARD ─────────────────────────────
  /dashboard/table-data:
    get:
      tags: [Dashboard & Reports]
      operationId: getDashboardTableData
      summary: Overloaded dashboard / report endpoint (shape depends on `status`)
      description: |
        The legacy endpoint returns a different `content` shape depending on `status`:
        - `status=2` → `content` is a single `DashboardSummary` object (home dashboard).
        - `status=4` → `content` is a single `UnitComparison` object (occupancy for `month`/`year`).
        - `status=1` → Page whose `content` is `PropertyReportRow[]` (monthly property report).

        If the estate is blocked/unpaid, return `content: null` (optionally with
        `{status:"002", message}`); the app then calls `GET /estate-invoices/check-status/{estateId}`.

        Recommendation for the rebuild: implement three handlers behind this one route, and expose
        clean routes (`/dashboard/summary`, `/dashboard/units`, `/reports/property`) for the web app.
      parameters:
        - name: status
          in: query
          required: true
          schema: { type: string, enum: ['1', '2', '4'] }
        - $ref: '#/components/parameters/EstateIdQuery'
        - $ref: '#/components/parameters/PropertyIdQuery'
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: See description for which shape applies.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: SummaryResponse (status=2)
                    properties:
                      content:
                        type: object
                        nullable: true
                        allOf: [{ $ref: '#/components/schemas/DashboardSummary' }]
                  - type: object
                    title: UnitComparisonResponse (status=4)
                    properties:
                      content: { $ref: '#/components/schemas/UnitComparison' }
                  - title: PropertyReportPage (status=1)
                    allOf:
                      - $ref: '#/components/schemas/PageMeta'
                      - type: object
                        properties:
                          content:
                            type: array
                            items: { $ref: '#/components/schemas/PropertyReportRow' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── PROPERTIES ─────────────────────────────
  /properties/all:
    get:
      tags: [Properties]
      operationId: listAllProperties
      summary: All properties for an estate (unpaginated)
      description: Raw array.
      parameters:
        - $ref: '#/components/parameters/EstateIdQuery'
      responses:
        '200':
          description: Properties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Property' }
        default: { $ref: '#/components/responses/Error' }

  /properties/specs/{propertyId}:
    get:
      tags: [Properties]
      operationId: getPropertySpecs
      summary: Lookup data for the "add house" form
      description: Raw object.
      parameters:
        - $ref: '#/components/parameters/PropertyIdPath'
      responses:
        '200':
          description: Floors, house types, categories and taken house numbers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseSpecs' }
        default: { $ref: '#/components/responses/Error' }

  /house-features/property/{propertyId}/{floorNo}:
    get:
      tags: [Properties]
      operationId: getPropertyFloorFeatures
      summary: Features available for houses on a floor
      description: Raw object.
      parameters:
        - $ref: '#/components/parameters/PropertyIdPath'
        - name: floorNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Features
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseFeatures' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── HOUSES ─────────────────────────────
  /houses:
    get:
      tags: [Houses]
      operationId: listHouses
      summary: Paginated houses
      description: Page.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/EstateIdQuery'
        - $ref: '#/components/parameters/PropertyIdQuery'
        - $ref: '#/components/parameters/CategoryIdQuery'
        - $ref: '#/components/parameters/SearchTerm'
        - name: occupied
          in: query
          description: '"true", "false" or empty for all.'
          schema: { type: string }
      responses:
        '200':
          description: Houses page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/House' }
        default: { $ref: '#/components/responses/Error' }

  /houses/new:
    post:
      tags: [Houses]
      operationId: createHouse
      summary: Add a house to a property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [houseNumber, floor, houseTypeId, rent, categoryId, propertyId, estateId]
              properties:
                houseNumber: { type: string }
                floor: { type: integer }
                houseTypeId: { type: integer }
                squareFt: { type: string, description: Numeric string }
                description: { type: string }
                rent: { type: string, description: Numeric string }
                categoryId: { type: integer }
                propertyId: { type: integer }
                estateId: { type: integer }
                featureIds:
                  type: array
                  items: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  /houses/{houseId}:
    get:
      tags: [Houses]
      operationId: getHouse
      summary: House detail with current tenant
      description: Raw object.
      parameters:
        - $ref: '#/components/parameters/HouseIdPath'
      responses:
        '200':
          description: House
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseDetails' }
        default: { $ref: '#/components/responses/Error' }

  /houses/unoccupied/all/{estateId}:
    get:
      tags: [Houses]
      operationId: listUnoccupiedHouses
      summary: Vacant houses (for assigning a tenant)
      description: Raw array.
      parameters:
        - $ref: '#/components/parameters/EstateIdPath'
      responses:
        '200':
          description: Vacant houses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UnoccupiedHouse' }
        default: { $ref: '#/components/responses/Error' }

  /houses/house-features/{houseId}:
    get:
      tags: [Houses]
      operationId: listHouseFeatures
      summary: Features attached to a house
      description: Raw array.
      parameters:
        - $ref: '#/components/parameters/HouseIdPath'
      responses:
        '200':
          description: Features
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── HOUSE CATEGORIES ─────────────────────────────
  /property-categories:
    get:
      tags: [House Categories]
      operationId: listHouseCategories
      summary: Paginated house categories
      description: Page.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/PropertyIdQuery'
        - $ref: '#/components/parameters/EstateIdQuery'
      responses:
        '200':
          description: Categories page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/HouseCategory' }
        default: { $ref: '#/components/responses/Error' }

  /property-categories/estate/{estateId}:
    get:
      tags: [House Categories]
      operationId: listHouseCategoriesForEstate
      summary: All categories for an estate (unpaginated)
      description: Raw array.
      parameters:
        - $ref: '#/components/parameters/EstateIdPath'
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IdName' }
        default: { $ref: '#/components/responses/Error' }

  /property-categories/flags/{action}/{id}:
    post:
      tags: [House Categories]
      operationId: flagHouseCategory
      summary: Activate / deactivate / delete a category
      parameters:
        - $ref: '#/components/parameters/FlagAction'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── TENANTS ─────────────────────────────
  /tenants:
    get:
      tags: [Tenants]
      operationId: listTenants
      summary: Paginated tenants (current occupancies)
      description: |
        Page. When the caller is a tenant, `self=true` limits results to their own occupancies.
        `userId` is only sent when filtering for one tenant.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PropertyIdQuery'
        - $ref: '#/components/parameters/EstateIdQuery'
        - $ref: '#/components/parameters/CategoryIdQuery'
        - $ref: '#/components/parameters/Self'
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/UserIdQuery'
      responses:
        '200':
          description: Tenants page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/TenantRow' }
        default: { $ref: '#/components/responses/Error' }

  /tenants/{tenantId}/details:
    get:
      tags: [Tenants]
      operationId: getTenantDetails
      summary: Tenant profile + totals
      description: Envelope.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StatusResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TenantDetails' }
        default: { $ref: '#/components/responses/Error' }

  /tenants/tenant-details:
    post:
      tags: [Tenants]
      operationId: searchTenantByIdNo
      summary: Look up an existing user by national ID / passport number
      description: |
        Envelope. `status: "00"` means the person already exists (form is pre-filled);
        any other status means "not found — enter details". `data` may be empty in that case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idNo]
              properties:
                idNo: { type: string }
      responses:
        '200':
          description: Search result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StatusResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TenantSearchResult' }
        default: { $ref: '#/components/responses/Error' }

  /tenants/assign-tenant:
    post:
      tags: [Tenants]
      operationId: assignTenant
      summary: Move a tenant into a house (creates the user if new)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [houseId, tenant, invoice]
              properties:
                houseId: { type: string }
                userId: { type: string, description: 'Existing user id, or empty for a new tenant' }
                payDate: { type: string, description: Day of month rent is due (e.g. "5") }
                withArrears: { type: boolean }
                currency: { type: string, description: 'Empty string from the app; default KES' }
                generateInvoice: { type: boolean }
                refundableAmount: { type: integer }
                tenant:
                  type: object
                  required: [firstName, lastName, email, phone, idNo]
                  properties:
                    id: { type: string }
                    firstName: { type: string }
                    lastName: { type: string }
                    email: { type: string, format: email }
                    phone: { type: string }
                    idNo: { type: string }
                invoice:
                  type: object
                  properties:
                    utilityBills:
                      type: array
                      items: {}
                    month: { type: integer, description: 'Month number (app sends 12)' }
                    nextMonth: { type: boolean }
                    newTenant: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  /tenants/house/history:
    get:
      tags: [Tenants]
      operationId: listHouseHistory
      summary: Past and current occupancies of a house
      description: Page.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: houseId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: History page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/HouseHistoryRow' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── METERS ─────────────────────────────
  /metres:
    get:
      tags: [Meters]
      operationId: listMeterReadings
      summary: Paginated meter readings
      description: |
        Page. `currentReading` is only sent when filtering by "read this month" (`true`) vs
        "not yet read" (`false`); omitted means all.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PropertyIdQuery'
        - $ref: '#/components/parameters/EstateIdQuery'
        - name: billId
          in: query
          schema: { type: string }
        - name: currentReading
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/SearchTerm'
        - name: houseId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Readings page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/MeterReading' }
        default: { $ref: '#/components/responses/Error' }

  /metres/specs:
    get:
      tags: [Meters]
      operationId: getMeterSpecs
      summary: Houses and existing meter numbers for a metered bill
      description: Raw object.
      parameters:
        - name: propertyId
          in: query
          required: true
          schema: { type: string }
        - name: billId
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Simple'
        - $ref: '#/components/parameters/Metred'
      responses:
        '200':
          description: Meter specs
          content:
            application/json:
              schema:
                type: object
                required: [houses, metreNos]
                properties:
                  houses:
                    type: array
                    items: { $ref: '#/components/schemas/IdNameString' }
                  metreNos:
                    type: array
                    items: { type: string }
        default: { $ref: '#/components/responses/Error' }

  /metres/new:
    post:
      tags: [Meters]
      operationId: createMeterReading
      summary: Register a meter with its first reading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metreNo, billId, houseId, currentReading]
              properties:
                metreNo: { type: string }
                billId: { type: string }
                previousReading: { type: string, description: Numeric string }
                currentReading: { type: string, description: Numeric string }
                houseId: { type: string }
                image: { $ref: '#/components/schemas/DataUriImage' }
                descrition: { type: string, description: 'Sic — misspelled key, keep it.' }
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  /metres/update-reading:
    post:
      tags: [Meters]
      operationId: updateMeterReading
      summary: Record this month's reading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metreId, currentReading]
              properties:
                metreId: { type: string }
                currentReading: { type: string, description: Numeric string }
                image: { $ref: '#/components/schemas/DataUriImage' }
                descrition: { type: string, description: 'Sic — misspelled key, keep it.' }
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── TENANT INVOICES ─────────────────────────────
  /invoices/{invoiceStatus}:
    get:
      tags: [Tenant Invoices]
      operationId: listTenantInvoices
      summary: Paginated tenant invoices by status
      description: Page. `userId` is only sent when listing one tenant's invoices.
      parameters:
        - $ref: '#/components/parameters/InvoiceStatusPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/EstateIdQuery'
        - $ref: '#/components/parameters/PropertyIdQuery'
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/CategoryIdQuery'
        - $ref: '#/components/parameters/Self'
        - name: houseId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/UserIdQuery'
      responses:
        '200':
          description: Invoices page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/TenantInvoiceRow' }
        default: { $ref: '#/components/responses/Error' }

  /invoices/detail/{invoiceRef}:
    get:
      tags: [Tenant Invoices]
      operationId: getTenantInvoice
      summary: Tenant invoice detail (also used to render the PDF)
      description: Envelope. Non-"00" status shows `message`.
      parameters:
        - $ref: '#/components/parameters/InvoiceRefPath'
      responses:
        '200':
          description: Invoice
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StatusResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TenantInvoiceDetail' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── ESTATE INVOICES ─────────────────────────────
  /estate-invoices/{invoiceStatus}:
    get:
      tags: [Estate Invoices]
      operationId: listEstateInvoices
      summary: Paginated platform-to-estate invoices by status
      description: Page.
      parameters:
        - $ref: '#/components/parameters/InvoiceStatusPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/SearchTerm'
      responses:
        '200':
          description: Estate invoices page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstateInvoicePage' }
        default: { $ref: '#/components/responses/Error' }

  /estate-invoices/pay:
    get:
      tags: [Estate Invoices]
      operationId: listPayableEstateInvoices
      summary: Unpaid estate invoices the admin can select to pay
      description: Page. Path is literal `pay`; route it before `/{invoiceStatus}`.
      parameters:
        - $ref: '#/components/parameters/EstateIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Payable invoices page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstateInvoicePage' }
        default: { $ref: '#/components/responses/Error' }

  /estate-invoices/detail/{invoiceRef}:
    get:
      tags: [Estate Invoices]
      operationId: getEstateInvoice
      summary: Estate invoice detail
      description: Envelope.
      parameters:
        - $ref: '#/components/parameters/InvoiceRefPath'
      responses:
        '200':
          description: Invoice
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StatusResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EstateInvoiceDetail' }
        default: { $ref: '#/components/responses/Error' }

  /estate-invoices/check-status/{estateId}:
    get:
      tags: [Estate Invoices]
      operationId: checkEstateInvoiceStatus
      summary: Whether the estate is paid up, unpaid, or blocked
      description: |
        Status only. `00` paid (no prompt), `001` unpaid (dismissible "Pay now" dialog showing
        `message`), `002` blocked (non-dismissible lock dialog showing `message`).
      parameters:
        - $ref: '#/components/parameters/EstateIdPath'
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StatusResponse'
                  - type: object
                    properties:
                      status: { type: string, enum: ['00', '001', '002'] }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── PAYMENTS ─────────────────────────────
  /payments:
    get:
      tags: [Payments]
      operationId: listPayments
      summary: Paginated tenant payments
      description: Page. `startDate`/`endDate` are `yyyy-MM-dd`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PropertyIdQuery'
        - $ref: '#/components/parameters/EstateIdQuery'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/Self'
        - $ref: '#/components/parameters/CategoryIdQuery'
        - $ref: '#/components/parameters/UserIdQuery'
      responses:
        '200':
          description: Payments page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/PaymentRow' }
        default: { $ref: '#/components/responses/Error' }

  /payments/detail/{paymentRef}:
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Payment receipt detail
      description: Envelope.
      parameters:
        - name: paymentRef
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Receipt
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StatusResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PaymentDetail' }
        default: { $ref: '#/components/responses/Error' }

  /payments/receive-payments:
    post:
      tags: [Payments]
      operationId: receiveTenantPayment
      summary: Record or initiate a payment against tenant invoice(s)
      description: |
        Behaviour depends on `paymentTypeId`:
        - `1` Cash, `2` Cheque, `11` Bank slip → record the payment and allocate it to the invoice(s).
        - `12` M-Pesa STK → **initiate** an STK push to `phoneNo`; respond `00` once the push is
          accepted. The invoice is settled later by the Daraja callback (see Proposed endpoints).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceivePaymentRequest' }
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  /payments/validate-slip/{slipRef}:
    get:
      tags: [Payments]
      operationId: validateBankSlip
      summary: Check a bank deposit slip reference against the bank statement
      description: Envelope. `00` = found; `data.amount` pre-fills the form.
      parameters:
        - name: slipRef
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StatusResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          refNo: { type: string }
                          message: { type: string }
                          amount: { type: string }
        default: { $ref: '#/components/responses/Error' }

  /payment-statements:
    get:
      tags: [Payments]
      operationId: listPaymentStatements
      summary: Incoming money on the estate's accounts (bank / M-Pesa statement lines)
      description: Page. `used` = whether the line has been allocated to an invoice.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/PropertyIdQuery'
        - $ref: '#/components/parameters/EstateIdQuery'
        - name: status
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: used
          in: query
          description: '"true", "false" or empty.'
          schema: { type: string }
        - name: paymentTypeId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Statement page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/PaymentStatementRow' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── ESTATE PAYMENTS ─────────────────────────────
  /estate-payments:
    get:
      tags: [Estate Payments]
      operationId: listEstatePayments
      summary: Payments the estate made to the platform
      description: Page.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/SearchTerm'
      responses:
        '200':
          description: Estate payments page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/EstatePaymentRow' }
        default: { $ref: '#/components/responses/Error' }

  /estate-payments/receive-payment:
    post:
      tags: [Estate Payments]
      operationId: receiveEstatePayment
      summary: Pay one or more estate invoices
      description: Same body as tenant payments but with `invoiceIds` (array). Note singular `receive-payment`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceivePaymentRequest' }
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── PAYMENT TYPES ─────────────────────────────
  /estate/payment-types:
    get:
      tags: [Payment Types]
      operationId: listPaymentAccounts
      summary: Paginated payment accounts configured for properties
      description: Page.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/PropertyIdQuery'
        - $ref: '#/components/parameters/EstateIdQuery'
      responses:
        '200':
          description: Payment accounts page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/PaymentAccount' }
        default: { $ref: '#/components/responses/Error' }

  /estate/payment-types/estate/{estateId}:
    get:
      tags: [Payment Types]
      operationId: listPaymentTypesForEstate
      summary: Payment types enabled for an estate (for filters)
      description: Page (even though it is not paginated by the client).
      parameters:
        - $ref: '#/components/parameters/EstateIdPath'
      responses:
        '200':
          description: Types
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/IdName' }
        default: { $ref: '#/components/responses/Error' }

  /estate/payment-types/property/{propertyId}:
    get:
      tags: [Payment Types]
      operationId: getPropertyPaymentTypeIds
      summary: Which types and banks a property accepts
      description: Envelope.
      parameters:
        - $ref: '#/components/parameters/PropertyIdPath'
      responses:
        '200':
          description: Ids
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StatusResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [bankIds, typeIds]
                        properties:
                          bankIds: { type: array, items: { type: integer } }
                          typeIds: { type: array, items: { type: integer } }
        default: { $ref: '#/components/responses/Error' }

  /estate/payment-types/{originInvoice}/{roleType}/{propertyId}:
    get:
      tags: [Payment Types]
      operationId: listPaymentMethodsForCheckout
      summary: Payment methods to show on the pay screen
      description: |
        Envelope with `data` array.
        - `originInvoice`: `hodi` when paying an estate invoice, otherwise the tenant-invoice origin.
        - `roleType`: `"1"` when the payer is the party who owes this invoice (admin paying `hodi`,
          tenant paying rent), `"0"` when someone records it on their behalf.
      parameters:
        - name: originInvoice
          in: path
          required: true
          schema: { type: string }
        - name: roleType
          in: path
          required: true
          schema: { type: string, enum: ['0', '1'] }
        - $ref: '#/components/parameters/PropertyIdPath'
      responses:
        '200':
          description: Methods
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StatusResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CheckoutPaymentMethod' }
        default: { $ref: '#/components/responses/Error' }

  /estate/payment-types/all:
    post:
      tags: [Payment Types]
      operationId: listAssignablePaymentTypesAndBanks
      summary: Catalogue of types and banks for the "add payment account" form
      description: Raw object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                propertyId: { type: string }
                estateId: { type: string }
      responses:
        '200':
          description: Types and banks
          content:
            application/json:
              schema:
                type: object
                required: [types, banks]
                properties:
                  types:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        description: { type: string }
                  banks:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        code: { type: string }
                        payBillNo: { type: string }
                        status: { type: integer }
        default: { $ref: '#/components/responses/Error' }

  /estate/payment-types/new:
    post:
      tags: [Payment Types]
      operationId: createPaymentAccount
      summary: Link a bank account / paybill to a property (OTP-protected)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [typeId, estateId, propertyId, otp]
              properties:
                typeId: { type: string }
                bankId: { type: string }
                estateId: { type: string }
                propertyId: { type: string }
                accountNo: { type: string }
                accountName: { type: string }
                payBillNo: { type: string }
                otp: { type: string, description: 'From GET /otps/initiate-type-otp/{estateId}' }
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  /estate/payment-types/flags/{action}/{id}:
    post:
      tags: [Payment Types]
      operationId: flagPaymentAccount
      summary: Activate / deactivate / delete a payment account
      parameters:
        - $ref: '#/components/parameters/FlagAction'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

