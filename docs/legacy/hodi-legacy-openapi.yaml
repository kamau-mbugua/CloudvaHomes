    # ── Payments ──
    ReceivePaymentRequest:
      type: object
      required: [amount, paidBy, paymentTypeId, propertyId]
      description: |
        Built in `payment_form_page.dart` / `payment_page.dart`. Fields by `paymentTypeId`:
        - 1 Cash: amount, paidBy, description, phoneNo
        - 2 Cheque: + refNo (cheque no), bankName ("<name>(<bank>)")
        - 11 Bank slip: + refNo (slip ref), bankId, validateSlip
        - 12 M-Pesa STK: + bankId, phoneNo (with country code, e.g. 254712345678)
        Tenant payments may send `invoiceId` (older screen) or `invoiceIds` (newer screen) — accept both.
      properties:
        amount: { type: string, description: Numeric string }
        paidBy: { type: string }
        description: { type: string }
        paymentTypeId: { type: integer, enum: [1, 2, 11, 12] }
        propertyId: { type: string }
        invoiceId: { type: string }
        invoiceIds:
          type: array
          items: { type: string }
        bankId: { type: string, nullable: true }
        phoneNo: { type: string }
        refNo: { type: string }
        bankName: { type: string }
        validateSlip: { type: boolean }
