                amount: { type: string, description: Numeric string }
                type: { type: integer, enum: [0, 1] }
                propertyId: { type: integer }
                estateId: { type: integer }
                months: { type: string, description: 'Number of months of rent (deposit); may be empty' }
                refundable: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  /onboard-fees/flags/{action}/{id}:
    post:
      tags: [Onboard Fees]
      operationId: flagOnboardFee
      summary: Activate / deactivate / delete a move-in fee
      parameters:
