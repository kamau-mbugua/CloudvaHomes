        - $ref: '#/components/parameters/PropertyIdQuery'
        - $ref: '#/components/parameters/EstateIdQuery'
      responses:
        '200':
          description: Utility bills page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/UtilityBillRow' }
        default: { $ref: '#/components/responses/Error' }

  /utility-bills/all:
    get:
      tags: [Utility Bills]
      operationId: listUtilityBillsForProperty
      summary: Bills for a property (metered only when `metred=true`)
      description: Raw array.
      parameters:
        - name: propertyId
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Simple'
        - $ref: '#/components/parameters/Metred'
      responses:
        '200':
          description: Bills
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [amount, name, id]
                  properties:
                    amount: { type: integer }
                    name: { type: string }
                    id: { type: string }
        default: { $ref: '#/components/responses/Error' }

  /utility-bills/new:
    post:
      tags: [Utility Bills]
      operationId: createUtilityBill
      summary: Create a utility bill for a property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, propertyId, estateId]
              properties:
                name: { type: string }
                amount: { type: string, description: Numeric string }
                type: { type: integer, enum: [0, 1, 2] }
                propertyId: { type: integer }
                estateId: { type: integer }
                metredBillId: { type: string, description: Empty unless type=2 }
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  /utility-bills/flags/{action}/{id}:
    post:
      tags: [Utility Bills]
      operationId: flagUtilityBill
      summary: Activate / deactivate / delete a utility bill
      parameters:
        - $ref: '#/components/parameters/FlagAction'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/StatusOk' }
        default: { $ref: '#/components/responses/Error' }

  /metred-bills:
    get:
      tags: [Utility Bills]
      operationId: listMeteredBillTypes
      summary: System catalogue of metered bill kinds (Water, Electricity…)
      description: Raw array. App always sends `simple=true`.
      parameters:
        - $ref: '#/components/parameters/Simple'
      responses:
        '200':
          description: Metered bill kinds
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IdNameString' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── ONBOARD FEES ─────────────────────────────
  /onboard-fees:
    get:
      tags: [Onboard Fees]
      operationId: listOnboardFees
      summary: Paginated move-in (onboard) fees
      description: Page.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/PropertyIdQuery'
        - $ref: '#/components/parameters/EstateIdQuery'
      responses:
        '200':
          description: Fees page
          content:
            application/json:
