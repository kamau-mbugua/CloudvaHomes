name: hodi_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.4.3
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  fluro: ^2.0.5
  connectivity_plus: ^4.0.0
  shared_preferences: ^2.3.3
  get_it: ^8.0.2
  dio: ^5.7.0
  shimmer_animation: ^2.2.1
  fl_chart: ^0.69.0
  gauge_indicator: ^0.4.3
  easy_stepper: ^0.8.5+1
  flutter_speed_dial: ^7.0.0
  nb_utils: any
  logger: ^2.4.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.5
  infinite_scroll_pagination: ^4.1.0
  font_awesome_flutter: ^10.8.0
  country_code_picker: ^3.0.0
  email_validator: ^3.0.0
  intl: ^0.19.0
  flutter_flavorizr: ^2.2.3
  custom_scroll_date_range_picker: ^1.0.12
  pdf: ^3.11.1
  flutter_pdfview: ^1.3.4
  share_plus: ^10.1.2
  flutter_otp_text_field: ^1.2.0
  open_file: ^3.5.10
  flutter_svg: ^2.0.16
  package_info_plus: ^8.3.0
  webview_flutter: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  fluttertoast: ^8.2.10

flavorizr:
  useTemplateFiles: true
  flavors:
    dev:
      app:
        name: Hodi Dev
        description: "Hodi App Dev"
        version: 1.0.0
        buildNumber: 1
      flavorType: development
      name: Development
      color: Colors.red
      flavorBuildType: debug
      flavorProperties:
        baseUrl: "https://hodi-test.qnex.io/api/"
      android:
        applicationId: "com.qnex.hodi.dev"
        applicationIdSuffix: ".dev"

    uat:
      app:
        name: Hodi UAT
        description: "Hodi App UAT"
        version: 1.0.0
        buildNumber: 1
      flavorType: uat
      name: UAT
      color: Colors.blue
      flavorBuildType: release
      flavorProperties:
        baseUrl: "https://hodi-test.qnex.io/api/"
        android:
          applicationId: "com.qnex.hodi.uat"
          applicationIdSuffix: ".uat"

    prod:
      app:
        name: Hodi
        description: "Hodi App"
        version: 1.0.0
        buildNumber: 1
      flavorType: production
      name: Production
      color: Colors.green
      flavorBuildType: release
      flavorProperties:
        baseUrl: "https://hodi.qnex.io/api/"
      android:
        applicationId: "com.qnex.hodi"
        applicationIdSuffix: ""

  env_vars:
    - name: FLAVOR
      value: "dev"
  templates:
    app:
      - target: "lib/app.dart"
        path: "lib/flavorizr/templates/app.dart"
      - target: "lib/main.dart"
        path: "lib/flavorizr/templates/main.dart"
flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/image/
    - assets/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400