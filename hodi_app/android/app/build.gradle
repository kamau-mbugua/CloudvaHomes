plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}


android {

    // ----- BEGIN flavorDimensions (autogenerated by flutter_flavorizr) -----
    flavorDimensions += "flavor-type"

    productFlavors {
        dev {
            dimension "flavor-type"
            applicationId "com.qnex.hodi.dev"
            resValue "string", "app_name", "Hodi Dev"
        }
        uat {
            dimension "flavor-type"
            applicationId "com.qnex.hodi.uat"
            resValue "string", "app_name", "Hodi UAT"
        }
        prod {
            dimension "flavor-type"
            applicationId "com.qnex.hodi"
            resValue "string", "app_name", "Hodi"
        }
    }

    // ----- END flavorDimensions (autogenerated by flutter_flavorizr) -----

        namespace = "com.qnex.hodi"
    compileSdk = 35
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }


    kotlin {
        jvmToolchain(17)
    }

    configurations.all {
        exclude group: 'com.google.mlkit', module: 'entity-extraction'
    }

    defaultConfig {
        applicationId = "com.qnex.hodi"
        minSdk = 21
        targetSdk = 35
        versionCode = 1
        versionName = "1.0.0"
    }

    signingConfigs {
        release {
            keyAlias project.property('MYAPP_RELEASE_KEY_ALIAS')
            keyPassword project.property('MYAPP_RELEASE_KEY_PASSWORD')
            storeFile file(project.property('MYAPP_RELEASE_STORE_FILE'))
            storePassword project.property('MYAPP_RELEASE_STORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "app-${variant.name}.apk"
        }
    }

//                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      {
//        abi {
//            enable true
//            reset()
//            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
//            universalApk false
//        }
//    }

    defaultConfig {
        multiDexEnabled true
    }
}


dependencies {
    implementation 'com.google.mlkit:entity-extraction:16.0.0-beta5'
    implementation 'com.google.mlkit:text-recognition:16.0.0-beta5'
    implementation 'com.android.support:multidex:1.0.3'
    // ... other dependencies
}

flutter {
    source = "../.."
}
